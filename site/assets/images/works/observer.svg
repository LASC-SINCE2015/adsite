<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <!-- 監視モニターのイメージ（作品「Observer」のサムネイル） -->
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.28"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#14361f"/>
      <stop offset="1" stop-color="#05110a"/>
    </radialGradient>
  </defs>
  <rect x="30" y="8" width="260" height="164" rx="14" fill="#1b1a19"/>
  <rect x="42" y="20" width="236" height="140" rx="8" fill="url(#glow)"/>
  <g fill="none" stroke="#5fe08a" stroke-width="1.5" opacity="0.75">
    <!-- 廊下の遠近線 -->
    <path d="M42 160 L132 82 L188 82 L278 160"/>
    <path d="M42 20 L132 70 L188 70 L278 20"/>
    <rect x="132" y="70" width="56" height="12"/>
    <path d="M100 108 V136 M220 108 V136" opacity="0.6"/>
  </g>
  <!-- 人影 -->
  <g fill="#5fe08a" opacity="0.55">
    <circle cx="168" cy="96" r="5"/>
    <path d="M161 104 h14 l3 26 h-20 z"/>
  </g>
  <g font-family="monospace" font-size="11" fill="#5fe08a">
    <text x="52" y="36">CAM-01</text>
    <text x="196" y="36">PAST 02:14</text>
  </g>
  <circle cx="58" cy="148" r="4" fill="#e0574a"/>
  <text x="66" y="152" font-family="monospace" font-size="10" fill="#e0574a">REC</text>
  <rect x="42" y="20" width="236" height="140" rx="8" fill="url(#scan)"/>
</svg>
