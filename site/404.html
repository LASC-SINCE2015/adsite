<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ページが見つかりませんでした | LASC Atelier</title>
  <meta name="robots" content="noindex">
  <!-- このページはどの階層の URL でも表示されるので、読み込むファイルはサイトの最上位からのパスで書く -->
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="/assets/js/game-404.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="/">LASC Atelier</a>
    <nav aria-label="サイト内">
      <a href="/#works">作品</a>
      <a href="/#profile">プロフィール</a>
    </nav>
  </header>

  <main class="page">
    <h1>ページが見つかりませんでした</h1>
    <p class="not-found-lead">お探しのページは、移動または削除されたか、URL が間違っている可能性があります。</p>
    <a class="button-link" href="/">トップページへ戻る</a>

    <section class="game" aria-labelledby="game-heading">
      <h2 id="game-heading">せっかくなので、ひと遊び</h2>
      <p class="game-help">「404」の形に並んだブロックを、ボールを打ち返して全部くずすと、道がひらけます。</p>
      <p class="game-help">操作: マウスや指でバーを動かし、クリック・タップで発射。キーボードなら ← → で移動、スペースキーで発射・一時停止。</p>
      <canvas class="game-canvas" id="game-canvas" width="480" height="360" tabindex="0" role="img" aria-label="ブロックくずしのゲーム画面"></canvas>
      <div class="game-controls">
        <button class="game-button" id="game-start" type="button">はじめから遊ぶ</button>
        <p class="game-status" id="game-status" role="status"></p>
      </div>
      <noscript><p class="game-help">ゲームで遊ぶには JavaScript を有効にしてください。</p></noscript>
    </section>
  </main>

  <footer class="site-footer">
    <nav class="footer-nav" aria-label="サイトの情報">
      <a href="/about.html">サイトについて</a>
      <a href="/privacy.html">プライバシーポリシー</a>
    </nav>
    <small>&copy; LASC Atelier</small>
  </footer>
</body>
</html>
